<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8ef"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><title>体重·热量记录</title></head><body><main><h1>体重 · 热量记录</h1><section class="card"><div class="grid"><label>日期<input id="date" type="date"></label><label>体重（kg）<input id="weight" type="number" step="0.1" placeholder="例如 65.2"></label></div><div class="total">今日摄入：<b id="total">0</b> kcal</div><button id="save">保存今天记录</button></section><section class="card"><h2>添加食品</h2><div class="foodrow"><select id="food"></select><input id="grams" type="number" value="100" placeholder="克"><button id="add">添加</button></div><ul id="foods"></ul></section><section class="card"><h2>体重趋势</h2><canvas id="chart" height="220"></canvas><p id="empty">保存至少两天记录后显示趋势</p></section></main><script src="app.js?v=2"></script></body></html>
